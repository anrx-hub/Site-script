<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Light Calvary Scripts</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800;900&display=swap" rel="stylesheet">
    <style>
        /* CSS Variables & Color Palette */
        :root {
            --bg-main: #0a0a0a;
            --bg-card: #141414;
            --primary-yellow: #ffcc00;
            --text-white: #ffffff;
            --text-gray: #aaaaaa;
            --glow-shadow: 0 0 15px rgba(255, 204, 0, 0.3);
            --discord-color: #5865F2;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-white);
            padding-bottom: 50px;
        }

        /* Navigation Bar (Menu) */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 40px;
            background-color: #0d0d0d;
            border-bottom: 1px solid #222;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        nav .logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--primary-yellow);
            text-shadow: 0 0 8px rgba(255, 204, 0, 0.4);
            text-decoration: none;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .nav-links a {
            color: var(--text-white);
            text-decoration: none;
            font-weight: 600;
            transition: color 0.2s;
        }

        .nav-links a:hover {
            color: var(--primary-yellow);
        }

        /* Discord Button Styling */
        .discord-btn {
            background-color: var(--discord-color);
            color: white !important;
            padding: 8px 16px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 600;
            transition: transform 0.2s, background-color 0.2s !important;
        }

        .discord-btn:hover {
            background-color: #4752c4;
            transform: scale(1.05);
        }

        /* Header / Hero Section */
        header {
            text-align: center;
            padding: 50px 20px 30px 20px;
            background: linear-gradient(to bottom, #111, var(--bg-main));
        }

        header h1 {
            font-size: 3rem;
            font-weight: 900;
            color: var(--primary-yellow);
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.5);
            margin-bottom: 10px;
        }

        header p {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        /* Search Bar Section */
        .search-container {
            max-width: 500px;
            margin: 0 auto 40px auto;
            padding: 0 20px;
            text-align: center;
        }

        .search-box {
            width: 100%;
            padding: 14px 20px;
            background-color: #111;
            border: 2px solid #222;
            border-radius: 30px;
            color: var(--text-white);
            font-size: 1rem;
            outline: none;
            transition: all 0.3s ease;
            text-align: center;
        }

        .search-box:focus {
            border-color: var(--primary-yellow);
            box-shadow: var(--glow-shadow);
            background-color: #141414;
        }

        /* Scripts Container */
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }

        /* Script Card Layout */
        .script-card {
            background-color: var(--bg-card);
            border: 1px solid #222;
            border-radius: 12px;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .script-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary-yellow);
            box-shadow: var(--glow-shadow);
        }

        /* Script Thumbnail */
        .script-thumb {
            width: 100%;
            height: 180px;
            object-fit: cover;
            border-bottom: 2px solid #222;
        }

        /* Card Content */
        .script-info {
            padding: 20px;
        }

        .map-name {
            font-size: 1.2rem;
            color: var(--primary-yellow);
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* Script Code Area */
        .code-box {
            background-color: #050505;
            border: 1px solid #333;
            border-radius: 6px;
            padding: 12px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.85rem;
            color: #00ff66;
            direction: ltr;
            text-align: left;
            white-space: nowrap;
            overflow-x: auto;
            margin-bottom: 15px;
        }

        /* Copy Button */
        .copy-btn {
            width: 100%;
            background-color: var(--primary-yellow);
            color: #000;
            border: none;
            padding: 10px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            background-color: #e6b800;
            box-shadow: 0 0 10px rgba(255, 204, 0, 0.4);
        }

        .copy-btn:active {
            transform: scale(0.98);
        }

        /* Success State for Copy Button */
        .copied {
            background-color: #00ff66 !important;
            color: #000 !important;
        }

        /* No Results Message */
        .no-results {
            grid-column: 1 / -1;
            text-align: center;
            color: var(--text-gray);
            font-size: 1.2rem;
            padding: 40px;
            display: none;
        }

        /* Responsive Design */
        @media (max-width: 600px) {
            nav {
                flex-direction: column;
                gap: 15px;
                padding: 15px 20px;
            }
        }
    </style>
</head>
